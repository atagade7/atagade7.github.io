<!-- Recover from URLs that picked up stray punctuation when copied out of an
     email or message (e.g. ".../cv-atagade.pdf," or "...pdf)"). Strip trailing
     punctuation and send the visitor to the real file. Runs before paint so the
     redirect is effectively invisible. -->
<script>
(function () {
  try {
    var p = window.location.pathname;
    var fixed = p.replace(/[,.;:!?)\]}>'"’”»]+$/, "");
    if (fixed && fixed !== p) {
      window.location.replace(fixed + window.location.search + window.location.hash);
    }
  } catch (e) {}
})();
</script>
